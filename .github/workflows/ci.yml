name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-cov mypy flake8
      - run: mypy app
      - run: flake8 app tests
      # PYTHONPATH=. - чтобы сервер GitHub без ошибок импортировал модули
      - run: PYTHONPATH=. pytest --cov=app --cov-report=term
